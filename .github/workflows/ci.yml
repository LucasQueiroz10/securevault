name: CI

on:
  push:
    branches: [main]
  # Permite que o CD reutilize este pipeline antes de publicar uma versão.
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # A aplicação exige DATABASE_URL para iniciar. Os testes trocam o banco por
    # um SQLite em memória (conftest.py); o PostgreSQL é exercitado no job docker.
    env:
      DATABASE_URL: "sqlite:///:memory:"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    # Só vale gastar tempo gerando a imagem se os testes passaram.
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Versão fixada: a v2.12.0 ainda não reconhece a flag --start-interval do HEALTHCHECK.
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile

      # O banco é descartável e morre com o runner, então os valores fictícios do
      # modelo bastam. De quebra, isso prova que o .env.example funciona.
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 120

      # Falha se alguém mudou um modelo e esqueceu de criar a migração.
      - name: Check migrations match models
        run: docker compose run --rm --no-deps migrate alembic check

      # Gerar a imagem não prova que ela funciona: testa a API gravando no banco.
      - name: Smoke test
        run: bash scripts/smoke-test.sh

      # Fora do smoke test de propósito: o deploy o reutiliza, e um rollback para
      # uma versão anterior à interface falharia nesta verificação.
      - name: Check web interface
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep 'id="register-form"' > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/app.js
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/style.css

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
