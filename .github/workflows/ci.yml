name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A aplicação exige DATABASE_URL para iniciar. Os testes trocam o banco por
    # um SQLite em memória (conftest.py); quando o CI ganhar um PostgreSQL,
    # este valor passa a apontar para ele.
    env:
      DATABASE_URL: "sqlite:///:memory:"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    # Só vale gastar tempo gerando a imagem se os testes passaram.
    needs: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versão fixada: a v2.12.0 ainda não reconhece a flag --start-interval do HEALTHCHECK.
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      - name: Build image
        run: docker build -t securevault-api:ci .

      # Gerar a imagem não prova que ela funciona: sobe o container e espera o
      # HEALTHCHECK aprovar.
      - name: Smoke test
        run: |
          docker run -d --name api -e DATABASE_URL=sqlite:////tmp/smoke.db securevault-api:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            if [ "$status" = "healthy" ]; then
              echo "Container saudável"
              exit 0
            fi
            sleep 2
          done
          echo "Container não ficou saudável (último status: $status)"
          docker logs api
          exit 1
