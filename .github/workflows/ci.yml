name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A aplicação exige DATABASE_URL para iniciar. Os testes trocam o banco por
    # um SQLite em memória (conftest.py); quando o CI ganhar um PostgreSQL,
    # este valor passa a apontar para ele.
    env:
      DATABASE_URL: sqlite:///:memory:

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest