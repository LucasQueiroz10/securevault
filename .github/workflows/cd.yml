name: CD

# Uma release começa ao enviar uma tag no formato vX.Y.Z.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Menor privilégio: por padrão só lê o repositório. Cada job pede o que falta.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/lucasqueiroz10/securevault-api

jobs:
  # Mesma verificação dos pull requests: nada é publicado sem passar por ela.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tags podem apontar para qualquer commit: só o que entrou na main é publicado.
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN é criado para esta execução e expira ao final dela, então
      # não há senha para guardar nem para vazar.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sem a tag "latest" de propósito: deploy e rollback apontam sempre para
      # uma versão exata.
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Simula um ambiente de homologação no próprio runner: a stack sobe do zero e é
  # descartada ao final da execução. Em um servidor real, mudaria só onde estes
  # passos rodam. O "environment" libera os segredos apenas para este job e
  # registra o histórico de deploys no GitHub.
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: homologacao
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O digest garante que o deploy usa exatamente o artefato publicado acima.
      - name: Deploy published image
        env:
          POSTGRES_USER: securevault
          POSTGRES_DB: securevault
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash scripts/deploy.sh "$IMAGE:$VERSION@$DIGEST" "$VERSION"

  # Só vira release o que foi implantado e passou no smoke test.
  release:
    runs-on: ubuntu-latest
    needs: [publish, deploy]
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Imagem: \`$IMAGE:$VERSION\` (\`$DIGEST\`)"
