name: Rollback Drill

# Exercício iniciado à mão na aba Actions. Não publica nada: a stack e a imagem
# com defeito são descartadas ao final da execução.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável publicada (por exemplo, 0.1.1)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run rollback drill
        env:
          POSTGRES_USER: securevault
          POSTGRES_DB: securevault
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/rollback-drill.sh "$VERSION"
